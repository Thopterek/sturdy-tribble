definitions:
  main.Chirp:
    properties:
      body:
        type: string
      created_at:
        type: string
      id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  main.Data:
    properties:
      user_id:
        type: string
    type: object
  main.LoginResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_chirpy_red:
        type: boolean
      refresh_token:
        type: string
      token:
        type: string
      updated_at:
        type: string
    type: object
  main.Params:
    properties:
      body:
        type: string
      user_id:
        type: string
    type: object
  main.Payload:
    properties:
      data:
        $ref: '#/definitions/main.Data'
      event:
        type: string
    type: object
  main.RefreshResp:
    properties:
      token:
        type: string
    type: object
  main.RequestUserUpdate:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  main.ResponseUserUpdate:
    properties:
      email:
        type: string
    type: object
  main.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_chirpy_red:
        type: boolean
      token:
        type: string
      updated_at:
        type: string
    type: object
  main.createUser:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
info:
  contact: {}
paths:
  /admin/metrics:
    get:
      consumes:
      - text/html
      description: Returns a simple HTML page with metrics. Admin-only endpoint in
        this app.
      produces:
      - text/html
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Admin metrics page
      tags:
      - admin
  /admin/reset:
    post:
      consumes:
      - application/json
      description: Resets in-memory hits counter and deletes all users from the database.
        Only available on dev platform.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset application hits and delete all users (dev only)
      tags:
      - admin
  /api/chirps:
    get:
      consumes:
      - application/json
      description: 'Returns a list of chirps. Optional query params: author_id (UUID)
        and sort (asc|desc).'
      parameters:
      - description: Author UUID
        in: query
        name: author_id
        type: string
      - description: Sort order (asc|desc)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Chirp'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List chirps
      tags:
      - chirps
    post:
      consumes:
      - application/json
      description: Creates a new chirp for the authenticated user. Requires a valid
        Bearer JWT token.
      parameters:
      - description: Bearer <JWT token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Chirp payload
        in: body
        name: chirp
        required: true
        schema:
          $ref: '#/definitions/main.Params'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.Chirp'
        "400":
          description: Bad request (invalid body)
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized (missing or invalid token)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new chirp
      tags:
      - chirps
  /api/chirps/{chirpID}:
    delete:
      consumes:
      - application/json
      description: Deletes a chirp by UUID. Requires Bearer JWT token of the owner.
      parameters:
      - description: Bearer <JWT token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Chirp UUID
        in: path
        name: chirpID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a chirp
      tags:
      - chirps
    get:
      consumes:
      - application/json
      description: Get a chirp by its UUID
      parameters:
      - description: Chirp UUID
        in: path
        name: chirpID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Chirp'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a single chirp
      tags:
      - chirps
  /api/healthz:
    get:
      consumes:
      - text/plain
      description: Returns 200 OK if the service is ready
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health/readiness check
      tags:
      - health
  /api/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password, returns JWT and refresh
        token
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - auth
      - users
  /api/polka/webhooks:
    post:
      consumes:
      - application/json
      description: Receives Polka webhook events and upgrades a user to 'Chirpy Red'.
        Expects Authorization header with ApiKey.
      parameters:
      - description: ApiKey <key>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Webhook payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.Payload'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Handle Polka webhook for user upgrade
      tags:
      - webhooks
      - users
  /api/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a refresh token (provided in Authorization header) for
        a new JWT token.
      parameters:
      - description: Bearer <refresh token>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.RefreshResp'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh JWT token
      tags:
      - auth
  /api/revoke:
    post:
      consumes:
      - application/json
      description: Revokes a refresh token provided in the Authorization header.
      parameters:
      - description: Bearer <refresh token>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Revoke a refresh token
      tags:
      - auth
  /api/users:
    post:
      consumes:
      - application/json
      description: Creates a new user with email and password, and returns the user
        info with a JWT token
      parameters:
      - description: User creation payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/main.createUser'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.User'
        "400":
          description: Bad request (invalid email or password)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new user
      tags:
      - auth
      - users
    put:
      consumes:
      - application/json
      description: Update the authenticated user's password and/or email. Requires
        Bearer JWT token.
      parameters:
      - description: Bearer <JWT token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: User update payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/main.RequestUserUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ResponseUserUpdate'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update user password/email
      tags:
      - users
      - auth
swagger: "2.0"
